<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Four connected areas of interest</title>
<desc id="desc">Computational Jewish studies, Hebrew speech and language, data and reliable systems, and knowledge engineering shown as four research areas.</desc>
<rect width="1200" height="250" rx="7" fill="#F7F8F6"/>
<rect x=".5" y=".5" width="1199" height="249" rx="7" stroke="#D4DBD9" fill="none"/>
<text x="39" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="2.3" fill="#344E55">CONNECTED AREAS OF WORK</text>
<path d="M39 56H1160" stroke="#D0D9D6" stroke-width="1.2"/>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(39 84)"><rect width="261" height="119" rx="4" fill="#E8EDEB"/>
<text x="18" y="27" font-size="15" fill="#58746F">01 / RESEARCH</text>
<text x="18" y="58" font-size="22" fill="#233A41" font-weight="700">Jewish texts</text><text x="18" y="84" font-size="16" fill="#4B6267">Sources, language,</text><text x="18" y="105" font-size="16" fill="#4B6267">interpretation</text></g>
<g transform="translate(326 84)"><rect width="261" height="119" rx="4" fill="#ECEFF1"/>
<text x="18" y="27" font-size="15" fill="#58746F">02 / LANGUAGE</text>
<text x="18" y="58" font-size="22" fill="#233A41" font-weight="700">Speech &amp; audio</text><text x="18" y="84" font-size="16" fill="#4B6267">Transcription,</text><text x="18" y="105" font-size="16" fill="#4B6267">alignment, models</text></g>
<g transform="translate(613 84)"><rect width="261" height="119" rx="4" fill="#E8EDEB"/>
<text x="18" y="27" font-size="15" fill="#58746F">03 / ENGINEERING</text>
<text x="18" y="58" font-size="22" fill="#233A41" font-weight="700">Data systems</text><text x="18" y="84" font-size="16" fill="#4B6267">Quality, pipelines,</text><text x="18" y="105" font-size="16" fill="#4B6267">reliability</text></g>
<g transform="translate(900 84)"><rect width="261" height="119" rx="4" fill="#ECEFF1"/>
<text x="18" y="27" font-size="15" fill="#58746F">04 / APPLICATION</text>
<text x="18" y="58" font-size="22" fill="#233A41" font-weight="700">Knowledge tools</text><text x="18" y="84" font-size="16" fill="#4B6267">Learning, evidence,</text><text x="18" y="105" font-size="16" fill="#4B6267">accessibility</text></g></g>
<text x="40" y="231" font-size="13" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1" fill="#6E7D7C">AN INTERDISCIPLINARY PRACTICE — FROM PRIMARY SOURCES TO RESPONSIBLE TECHNOLOGY</text>
</svg>